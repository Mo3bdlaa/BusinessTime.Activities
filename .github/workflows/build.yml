name: Build

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore BusinessTime.Activities.sln

      - name: Build
        run: dotnet build BusinessTime.Activities.sln -c Release --no-restore

      - name: Test
        run: dotnet test BusinessTime.Activities.sln -c Release --no-build

      - name: Pack
        run: dotnet pack src/BusinessTime.Activities/BusinessTime.Activities.csproj -c Release -o artifacts --no-build

      # Packing without the designers is only a warning, and warnings do not fail a build, so the shape of
      # the package is asserted here instead: designers with the Windows assets, never with the portable ones.
      - name: Verify package layout
        run: |
          set -euo pipefail
          package=$(ls artifacts/*.nupkg)
          contents=$(unzip -l "$package")
          echo "$contents"

          expect() {
            if ! grep -q "$1" <<<"$contents"; then
              echo "::error::Expected $1 in $package"
              exit 1
            fi
          }

          expect "lib/net461/BusinessTime.Activities.dll"
          expect "lib/net461/BusinessTime.Activities.Design.dll"
          expect "lib/net461/BusinessTime.Core.dll"
          expect "lib/net6.0/BusinessTime.Activities.dll"
          expect "lib/net6.0/BusinessTime.Core.dll"
          expect "lib/net6.0/BusinessTime.Activities.Wizard.dll"
          # The wizard names its ribbon icon by path, so the file has to sit beside the assembly.
          expect "lib/net6.0/calendar.png"
          # The designers a modern Studio loads. The .NET Framework ones next to them serve legacy projects.
          expect "lib/net6.0/BusinessTime.Activities.Design.dll"

          # The stubs exist only to compile against Studio's own designer assemblies. Shipping a copy would
          # shadow the real ones and break every designer in the package.
          forbid() {
            if grep -q "$1" <<<"$contents"; then
              echo "::error::$1 must not ship in $package"
              exit 1
            fi
          }

          forbid "System.Activities.Presentation.dll"
          forbid "System.Activities.Metadata.dll"
          forbid "System.Activities.dll"

          # Studio and the Robot provide the workflow runtime. Depending on it here would install a second
          # copy beside the host's, which breaks loading System.Activities in a Windows project.
          nuspec=$(unzip -p "$package" "*.nuspec")

          # The name Studio's package manager shows. The id stays dotted for the feed; this is what a
          # person reads, so a build that loses it would be installed under a name nobody chose.
          if ! grep -q "<title>Shaker BusinessTime Activities</title>" <<<"$nuspec"; then
            echo "::error::The package must be titled 'Shaker BusinessTime Activities'"
            echo "$nuspec"
            exit 1
          fi

          if grep -q "UiPath.Workflow" <<<"$nuspec"; then
            echo "::error::The package must not depend on UiPath.Workflow; the host provides the workflow runtime"
            echo "$nuspec"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: activity-package
          path: artifacts/*.nupkg

  # Publishing a release needs a token allowed to write to the repository, which the one a workflow runs
  # with is. It is keyed on the version in Directory.Build.props and skips a version already released, so
  # pushing to main publishes each new version exactly once and changes nothing in between.
  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        run: |
          set -euo pipefail
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)
          if [ -z "$version" ]; then
            echo "::error::No <Version> found in Directory.Build.props"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version is $version"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          # The package checked in under packages/ is the one whose checksum the documentation quotes, so
          # that is the file the release carries rather than a fresh build of the same source.
          package=$(ls packages/*."$VERSION".nupkg)
          checksum=$(sha256sum "$package" | cut -d' ' -f1)
          echo "Releasing $package ($checksum)"

          # A version already released is left alone, unless the file checked in is no longer the file
          # published under it: a release carrying a stale package is worse than no release, and the
          # version is what people quote, so the release is replaced rather than renumbered.
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            published=$(mktemp -d)
            gh release download "v$VERSION" --dir "$published" --pattern '*.nupkg' || true
            if [ -n "$(ls -A "$published")" ] \
              && [ "$(sha256sum "$published"/*.nupkg | cut -d' ' -f1)" = "$checksum" ]; then
              echo "v$VERSION already carries this package; nothing to do."
              exit 0
            fi
            echo "v$VERSION carries a different package; replacing it."
            gh release delete "v$VERSION" --yes --cleanup-tag
          fi

          cat > /tmp/notes.md <<'NOTES'
          Working-hours arithmetic for UiPath. Adding eight hours to Friday afternoon gives you Monday, not Saturday.

          ## Install

          Download the `.nupkg` below and put it in a folder. In Studio, open **Manage Packages → Settings**,
          add that folder as a user-defined package source, then install **Shaker.BusinessTime.Activities**.
          The activities appear under **Business Time** in the panel.

          ## What is in it

          **Twelve activities** — add and subtract business time, measure the working time between two
          moments, count business days, ask whether you are open, describe a day, snap an out-of-hours
          moment onto the calendar, find the next working day, and list the working windows in a period.

          **One calendar** covering several shifts a day, night shifts across midnight, holidays that repeat
          every year, shutdown ranges, half days, time zones and daylight saving — built in Studio, or kept
          in a JSON file several processes share. A **Business Calendar** editor in the ribbon maintains it.

          ## Targets

          `net461` for Windows-legacy projects, `net6.0` for Windows and cross-platform ones. The engine and
          the Studio designers travel inside the package, so one file is all Studio needs.

          MIT licensed. See the [README](https://github.com/Mo3bdlaa/BusinessTime.Activities#readme) for
          every property of every activity.
          NOTES

          gh release create "v$VERSION" "$package" \
            --title "v$VERSION — Shaker BusinessTime Activities" \
            --notes-file /tmp/notes.md \
            --latest
