name: Build

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore BusinessTime.Activities.sln

      - name: Build
        run: dotnet build BusinessTime.Activities.sln -c Release --no-restore

      - name: Test
        run: dotnet test BusinessTime.Activities.sln -c Release --no-build

      - name: Pack
        run: dotnet pack src/BusinessTime.Activities/BusinessTime.Activities.csproj -c Release -o artifacts --no-build

      - uses: actions/upload-artifact@v4
        with:
          name: activity-package
          path: artifacts/*.nupkg
